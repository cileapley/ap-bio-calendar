# =============================================================================
# AP BIOLOGY 2026-27 — COURSE CALENDAR SOURCE OF TRUTH
# =============================================================================
# This is the only file you edit. Run `python build.py` to regenerate dist/.
#
# Nothing here is a date except the district calendar itself. Units, topics and
# labs are expressed in PERIODS, and the builder walks them across the real
# instructional days. Move a unit, add a holiday, or change a period count and
# every downstream date recomputes on the next build.
#
# Provenance is marked on every section:
#   [CED]      College Board, AP Biology CED, Effective Fall 2025. Verbatim.
#   [PDF]      reference/2026-2027StudentAttendanceCalendar2.2.26.pdf
#   [PACING]   reference/ap-bio-pacing-2026-27.md (derived; author's own)
#   [DEFAULT]  A starting value chosen here. Yours to change. Not authoritative.
# =============================================================================


# -----------------------------------------------------------------------------
# COURSE
# -----------------------------------------------------------------------------
course:
  title: "AP Biology"
  school_year: "2026-27"
  district: "Kern High School District"

  # [PDF] Instruction begins Aug 12, 2026. Spring term ends May 27, 2027.
  first_instructional_day: 2026-08-12
  last_instructional_day:  2027-05-27

  # [CED] Monday, May 3, 2027 — Session 2 (afternoon; 12 p.m. local, lower 48).
  exam_date: 2027-05-03
  exam_note: "Session 2 — afternoon, 12 p.m. local"

  period_minutes: 60

  # Days of the week the section meets. Set meets_daily: false and edit meets_on
  # if the section sits out a day in a rotation or block schedule.
  meets_daily: true
  meets_on: [Mon, Tue, Wed, Thu, Fri]

  # Semester boundary. Unit 5 must finish on last_content_day; the next
  # `finals_days` instructional days are the semester 1 final exam block and are
  # off limits to content. Everything after that draws from the spring pool.
  # Move last_content_day and the fall/spring split recomputes on rebuild.
  semester_break:
    last_content_day: 2026-12-15   # Tue — last teaching day before finals
    finals_days: 3                 # Dec 16, 17, 18 — fall term ends Dec 18


# -----------------------------------------------------------------------------
# ASSUMPTIONS — the unresolved questions, made explicit
# -----------------------------------------------------------------------------
# [PACING §10] These are the two largest sources of error in any layout built
# from the pacing file. They are knobs here, not hidden constants, because the
# CED does not settle either one. Change them and rebuild to see the impact.
# -----------------------------------------------------------------------------
assumptions:

  # [RESEARCH 2026-07-31] Was 0.75 (assumes a 60-min period delivers x1.33 the
  # content of a CED 45-min period). Raised to 0.83 on evidence from a practicing
  # AP Bio teacher's published curriculum (Getting Down with Science), which
  # restates the CED's unit ranges but assumes 50-MINUTE periods — about 11% more
  # instructional minutes than the CED allots. 45 x 1.11 / 60 = 0.83.
  # This confirms the pacing file's §10 flag 1: 0.75 was too optimistic.
  # Unit 3 is the exception and gets more than the general uplift — see below.
  conversion_factor: 0.83

  # [PACING §10 flag 5] Unresolved whether CED unit period counts include lab
  # time. `true` = labs sit ON TOP of unit periods (the pacing file's reading,
  # which fails safe). `false` = labs are already inside the unit counts, and
  # scheduling them separately would double-count.
  labs_additive: true

  # [CED / Course Audit, verified 2026-07-31] "Students spend a minimum of 25% of
  # instructional time engaged in a wide range of hands-on, inquiry-based
  # laboratory investigations" AND "Students must conduct a minimum of 2 labs per
  # big idea" — i.e. 8 named investigations minimum, not all 13. Teachers may
  # substitute equivalent inquiry-based labs.
  #
  # This calendar schedules 8 investigations as dedicated multi-day blocks.
  # Those 16 days are ~10% of instructional time. The rest of the 25% line is
  # covered by hands-on work embedded inside topic days — data analysis,
  # modeling, microscopy, simulations — which is how the requirement is
  # normally satisfied in practice. The build reports the dedicated percentage
  # for reference, not as a warning.
  lab_fraction: 0.25

  # [DEFAULT] Periods per named investigation. The CED and the pacing file both
  # decline to allocate at this granularity. 2 = run the investigation, then
  # analysis and write-up. 8 investigations x 2 = 16 dedicated lab days.
  #
  # Was 3. Dropped to 2 on 2026-07-31 because three days per lab overstates how
  # most of these run in a 60-minute period. The day each lab gave back stays in
  # the unit that gave it, as flex — see the FLEX entries in Units 2, 3 and 4.
  # That keeps every unit's total constant, so the Dec 15 semester anchor holds
  # without any unit boundary moving, and an investigation that does overrun has
  # somewhere in its own unit to go.
  #
  # Any individual lab can override with its own `periods:`. Good candidates:
  # INV-8 (bacterial transformation, overnight growth) may want 3; INV-3 (BLAST,
  # computer-only) and INV-2 (spreadsheet modelling) may only want 1.
  default_lab_periods: 2


# -----------------------------------------------------------------------------
# DISTRICT CALENDAR — non-instructional days  [PDF]
# -----------------------------------------------------------------------------
# Weekends are excluded automatically. Only weekday exceptions go here.
# Use `date:` for one day or `from:`/`to:` for an inclusive range.
# -----------------------------------------------------------------------------
non_instructional_days:
  - {from: 2026-08-10, to: 2026-08-11, reason: "Teacher orientation (inservice)"}
  - {date: 2026-09-07, reason: "Labor Day"}
  - {date: 2026-11-11, reason: "Veterans Day"}
  - {from: 2026-11-23, to: 2026-11-27, reason: "Thanksgiving holidays"}
  - {from: 2026-12-21, to: 2027-01-01, reason: "Christmas recess"}
  - {date: 2027-01-18, reason: "Dr. Martin L. King, Jr. Day"}
  - {date: 2027-01-22, reason: "Non-student inservice day"}
  - {date: 2027-02-08, reason: "Lincoln's Day"}
  - {date: 2027-02-15, reason: "Washington's Day"}
  - {from: 2027-03-22, to: 2027-03-26, reason: "Easter recess"}
  - {date: 2027-03-29, reason: "District closed"}
  # DERIVED, not printed on the PDF: the 11th school month is labeled (9 Days)
  # and the spring term ends May 27, which forces May 28 to be non-instructional.
  # Falls after the exam, so it cannot affect AP Bio pacing either way.
  - {date: 2027-05-28, reason: "After spring term ends"}
  - {date: 2027-05-31, reason: "Memorial Day"}

# -----------------------------------------------------------------------------
# SITE TESTING DAYS — days the section does not meet or loses the period
# -----------------------------------------------------------------------------
# [PACING §2] CAASPP, PSAT, benchmark windows, assemblies. NOT on the district
# PDF — these are site-level and must be filled in by hand.
#
# Genuinely empty right now, not just unfilled: CAASPP does not affect this
# teacher's students, and PSAT falls on a Saturday this year, so neither one
# costs an instructional day. Interim assessment dates and assemblies are not
# yet decided — those are the expected future additions. Recorded here so a
# future reader doesn't re-investigate a settled question. Same format as
# non_instructional_days above.
# -----------------------------------------------------------------------------
site_testing_days: []


# -----------------------------------------------------------------------------
# SEQUENCE
# -----------------------------------------------------------------------------
# Ordered top to bottom. The builder consumes instructional days in this order.
#
# Per entry:
#   periods:     how many class days it consumes. `fill` = take all days
#                remaining until the next fixed anchor (exam / end of year).
#   kind:        topic | lab | assessment | opening | review  (drives styling)
#   visibility:  student (default) | teacher
#                A `teacher` entry STILL CONSUMES ITS DAYS but is stripped from
#                every published output. That is deliberate — hiding a block
#                must not silently shift student-facing dates.
#   notes:       free text, shown to students unless visibility is teacher
#   link:        optional URL surfaced on the student page
#
# To reorder: move the line. To rebalance: change `periods`. Rebuild.
# -----------------------------------------------------------------------------
#   prep:        lead times for a lab, in days. Three keys, each with a fixed
#                basis chosen to match how that step actually works:
#                  order   calendar days — purchasing runs over breaks
#                  arrive  calendar days — shipping runs on calendar time
#                  bench   school days   — prep is work done at school
#                Calendar-basis dates snap BACKWARD to an instructional day, so
#                a deadline is never moved later. Any key may be omitted.
#                `order: 21` is CONFIRMED — verified against the district's
#                actual purchase-order turnaround, not a placeholder. `arrive`
#                and `bench` values are still defaults from general lab
#                practice, NOT vendor data — replace them with your real kit
#                lead times when known.
# -----------------------------------------------------------------------------
blocks:

  # ===========================================================================
  # SEMESTER 1 — phase: fall. Draws from Aug 12 through Dec 15.
  # Units 1-5 plus a semester review block that auto-sizes to land Unit 5's last
  # day on the anchor. 83 instructional days in this pool.
  # ===========================================================================

  - id: opening
    phase: fall
    title: "Course Opening"
    entries:
      - {title: "Syllabus, lab safety, diagnostic", periods: 3, kind: opening}

  # ---------------------------------------------------------------------------
  - id: unit-1
    phase: fall
    unit: 1
    title: "Chemistry of Life"
    weight: [8, 11]          # [CED] exam weighting %
    ced_periods_45: [9, 11]  # [CED] verbatim
    entries:
      - {id: "1.1+1.2", title: "Structure of Water and Hydrogen Bonding · Elements of Life", skill: "2.A", periods: 1, kind: topic}
      - {id: "1.3+1.4", title: "Introduction to Macromolecules · Carbohydrates", skill: "2.A, 1.A", periods: 1, kind: topic}
      - {id: "1.5+1.6", title: "Lipids · Nucleic Acids", skill: "6.E, 2.A", periods: 1, kind: topic}
      # 3 periods, not 2: heaviest topic in the unit and the one Units 3 and 6
      # both lean on. Absorbs the 0.83 conversion uplift for this unit.
      - {id: "1.7", title: "Proteins", skill: "6.E", periods: 3, kind: topic}
      - {id: "1.FLEX", title: "Flex day — catch-up, reteach, or lab overflow", periods: 1, kind: flex}
      - {id: "1.PC", title: "Progress Check 1", periods: 1, kind: assessment}
      - {id: "1.TEST", title: "Unit 1 Assessment", periods: 1, kind: assessment}
    # [PACING §7] Unit 1 carries no investigation — a reason to keep it tight and
    # bank days early. Lowest exam weight in the course alongside Unit 5.

  # ---------------------------------------------------------------------------
  - id: unit-2
    phase: fall
    unit: 2
    title: "Cells"
    weight: [10, 13]
    ced_periods_45: [14, 16]
    entries:
      # [RESEARCH] 14-16 fifty-minute classes for this unit = ~13 sixty-minute
      # periods of content, against the 11 the 0.83 conversion alone would give.
      # 2.1 and 2.5+2.6 take the difference.
      - {id: "2.1", title: "Cell Structure and Function", skill: "1.A, 6.A", periods: 3, kind: topic}
      # 2 periods, not 1: the pacing file calls this the tightest squeeze in the
      # file. 2.2 now carries the body-size/metabolic-rate relationship that used
      # to sit in Unit 8.
      - {id: "2.2", title: "Cell Size", skill: "2.D, 5.A", periods: 2, kind: topic}
      - {id: "2.3+2.4", title: "Plasma Membrane · Membrane Permeability", skill: "2.A, 5.D", periods: 1, kind: topic}
      - {id: "2.5+2.6", title: "Membrane Transport · Facilitated Diffusion", skill: "3.D, 6.E", periods: 2, kind: topic}
      # 3 periods, not 2: water potential math is the reliable stumbling block.
      - {id: "2.7", title: "Tonicity and Osmoregulation", skill: "4.A", periods: 3, kind: topic, notes: "Water potential calculations."}
      - {id: "INV-4", title: "Investigation 4 — Diffusion and Osmosis", kind: lab, notes: "Big Idea 2: Energetics.", prep: {order: 21, arrive: 14, bench: 2}}
      - {id: "2.8", title: "Mechanisms of Transport", skill: "1.B", periods: 1, kind: topic}
      - {id: "2.9+2.10", title: "Cell Compartmentalization · Origins of Compartmentalization", skill: "6.E, 6.B", periods: 1, kind: topic}
      # 3 = 2 original + 1 reserved for INV-4 if it overruns its 2 days.
      - {id: "2.FLEX", title: "Flex days — catch-up, reteach, or lab overflow", periods: 3, kind: flex}
      - {id: "2.PC", title: "Progress Check 2", periods: 1, kind: assessment}
      - {id: "2.TEST", title: "Unit 2 Assessment", periods: 1, kind: assessment}

  # ---------------------------------------------------------------------------
  - id: unit-3
    phase: fall
    unit: 3
    title: "Cellular Energetics"
    weight: [12, 16]
    ced_periods_45: [12, 14]
    entries:
      # [RESEARCH] The one unit where practitioner pacing diverges sharply from
      # the CED: 14-17 fifty-minute classes against the CED's 12-14 forty-fives,
      # roughly 30% more instructional minutes, with the explicit warning that
      # "you need to move FAST through some difficult content." Photosynthesis
      # and respiration each take the extra period.
      - {id: "3.1", title: "Enzymes", skill: "1.B, 3.C", periods: 3, kind: topic}
      - {id: "3.2", title: "Environmental Impacts on Enzyme Function", skill: "6.E", periods: 1, kind: topic}
      - {id: "INV-13", title: "Investigation 13 — Enzyme Activity", kind: lab, notes: "Big Idea 4: System Interactions.", prep: {order: 21, arrive: 7, bench: 2}}
      - {id: "3.3", title: "Cellular Energy", skill: "6.C", periods: 1, kind: topic}
      - {id: "3.4", title: "Photosynthesis", skill: "6.B", periods: 4, kind: topic}
      - {id: "INV-5", title: "Investigation 5 — Photosynthesis", kind: lab, notes: "Big Idea 2: Energetics.", prep: {order: 21, arrive: 3, bench: 1}}
      - {id: "3.5", title: "Cellular Respiration", skill: "4.A", periods: 4, kind: topic}
      - {id: "INV-6", title: "Investigation 6 — Cellular Respiration", kind: lab, notes: "Big Idea 2: Energetics.", prep: {order: 21, arrive: 14, bench: 5}}
      # 5 = 2 original + 1 each reserved for INV-13, INV-5 and INV-6 if they
      # overrun their 2 days. This unit carries three investigations, which is
      # why its reserve is the largest in the course.
      - {id: "3.FLEX", title: "Flex days — catch-up, reteach, or lab overflow", periods: 5, kind: flex}
      - {id: "3.PC", title: "Progress Check 3", periods: 1, kind: assessment}
      - {id: "3.TEST", title: "Unit 3 Assessment", periods: 1, kind: assessment}

  # ---------------------------------------------------------------------------
  - id: unit-4
    phase: fall
    unit: 4
    title: "Cell Communication and Cell Cycle"
    weight: [10, 15]
    ced_periods_45: [12, 14]
    entries:
      # [PACING §10 flag 3] Suggested skills blank for Units 4-7 — the CED fetch
      # truncated. Fill from your copy if you want them on the student page.
      - {id: "4.1+4.2", title: "Cell Communication · Introduction to Signal Transduction", skill: "1.B, 1.A", periods: 1, kind: topic}
      # 3 periods, not 2: old topics 4.3 and 4.4 were merged into this one.
      - {id: "4.3", title: "Signal Transduction Pathways", skill: "6.C", periods: 3, kind: topic}
      - {id: "4.4", title: "Feedback", skill: "6.E", periods: 2, kind: topic}
      - {id: "4.5", title: "Cell Cycle", skill: "4.B, 5.A", periods: 2, kind: topic}
      - {id: "INV-7", title: "Investigation 7 — Cell Division: Mitosis and Meiosis", kind: lab, notes: "Big Idea 3: Information Storage and Transmission.", prep: {order: 21, arrive: 14, bench: 5}}
      - {id: "4.6", title: "Regulation of Cell Cycle", skill: "6.E", periods: 1, kind: topic}
      # 2 = 1 original + 1 reserved for INV-7 if it overruns its 2 days.
      - {id: "4.FLEX", title: "Flex days — catch-up, reteach, or lab overflow", periods: 2, kind: flex}
      - {id: "4.PC", title: "Progress Check 4", periods: 1, kind: assessment}
      - {id: "4.TEST", title: "Unit 4 Assessment", periods: 1, kind: assessment}

  # ---------------------------------------------------------------------------
  - id: unit-5
    phase: fall
    unit: 5
    title: "Heredity"
    weight: [8, 11]
    ced_periods_45: [8, 10]
    entries:
      - {id: "5.1+5.2", title: "Meiosis · Meiosis and Genetic Diversity", skill: "1.B, 3.A", periods: 1, kind: topic}
      # 3 periods, not 2: makes room to teach chi-square on observed-vs-expected
      # cross data rather than pre-teaching it or skipping it.
      - {id: "5.3", title: "Mendelian Genetics", skill: "5.C, 6.E", periods: 3, kind: topic, notes: "Includes chi-square analysis."}
      # 2 periods, not 1: non-Mendelian inheritance patterns are where the
      # Progress Check FRQs go full-length for the first time.
      - {id: "5.4", title: "Non-Mendelian Genetics", skill: "5.A, 5.C", periods: 2, kind: topic}
      - {id: "5.5", title: "Environmental Effects on Phenotype", skill: "1.C", periods: 1, kind: topic}
      - {id: "5.FLEX", title: "Flex day — catch-up, reteach, or lab overflow", periods: 1, kind: flex}
      - {id: "5.PC", title: "Progress Check 5", periods: 1, kind: assessment}
      - {id: "5.TEST", title: "Unit 5 Assessment", periods: 1, kind: assessment}

  # ---------------------------------------------------------------------------
  - id: semester-1-review
    phase: fall
    title: "Semester 1 Review"
    entries:
      # `fill` absorbs whatever is left in the fall pool, which is what makes
      # Unit 5 land on the semester anchor automatically. If you add a snow day
      # or lengthen a unit, this block shrinks and the anchor still holds. When
      # it hits zero the build errors instead of silently pushing into finals.
      - {title: "Semester 1 review — cumulative practice before finals", periods: fill, kind: review}

  # ---------------------------------------------------------------------------
  - id: finals
    phase: finals
    title: "Semester 1 Finals"
    entries:
      # Off limits to content. Sized by course.semester_break.finals_days.
      - {title: "Semester 1 final exam", periods: 3, kind: assessment}

  # ===========================================================================
  # SEMESTER 2 — phase: spring. Draws from Jan 4 through Apr 30.
  # Units 6-8 plus AP review. 75 instructional days in this pool.
  # ===========================================================================

  - id: unit-6
    phase: spring
    unit: 6
    title: "Gene Expression and Regulation"
    weight: [12, 16]
    ced_periods_45: [18, 20]
    entries:
      - {id: "6.1", title: "DNA and RNA Structure", skill: "1.C", periods: 1, kind: topic}
      - {id: "6.2", title: "DNA Replication", skill: "2.B", periods: 2, kind: topic}
      - {id: "6.3", title: "Transcription and RNA Processing", skill: "2.B", periods: 2, kind: topic}
      # [RESEARCH] Practitioner note on this unit: students "get stuck with the
      # details of the process of the central dogma." Translation takes the
      # extra period.
      - {id: "6.4", title: "Translation", skill: "2.D, 6.E", periods: 3, kind: topic}
      - {id: "6.5", title: "Regulation of Gene Expression", skill: "6.A", periods: 2, kind: topic}
      - {id: "6.6", title: "Gene Expression and Cell Specialization", skill: "6.B", periods: 1, kind: topic}
      - {id: "6.7", title: "Mutations", skill: "2.C", periods: 1, kind: topic}
      - {id: "6.8", title: "Biotechnology", skill: "6.D", periods: 2, kind: topic}
      - {id: "INV-8", title: "Investigation 8 — Biotechnology: Bacterial Transformation", kind: lab, notes: "Big Idea 3: Information Storage and Transmission.", prep: {order: 28, arrive: 7, bench: 3}}
      - {id: "6.FLEX", title: "Flex day — catch-up, reteach, or lab overflow", periods: 1, kind: flex}
      - {id: "6.PC", title: "Progress Check 6", periods: 1, kind: assessment}
      - {id: "6.TEST", title: "Unit 6 Assessment", periods: 1, kind: assessment}

  # ---------------------------------------------------------------------------
  - id: unit-7
    phase: spring
    unit: 7
    title: "Natural Selection"
    weight: [13, 20]
    ced_periods_45: [19, 21]
    entries:
      - {id: "7.1+7.2", title: "Introduction to Natural Selection · Natural Selection", skill: "2.A, 1.B", periods: 2, kind: topic}
      - {id: "7.3", title: "Artificial Selection", skill: "4.B", periods: 1, kind: topic}
      - {id: "7.4", title: "Population Genetics", skill: "3.B", periods: 1, kind: topic}
      - {id: "7.5", title: "Hardy–Weinberg Equilibrium", skill: "1.C, 5.A", periods: 3, kind: topic}
      - {id: "INV-2", title: "Investigation 2 — Mathematical Modeling: Hardy–Weinberg", kind: lab, notes: "Big Idea 1: Evolution.", prep: {order: 14, bench: 1}}
      - {id: "7.6", title: "Evidence of Evolution", skill: "4.B", periods: 1, kind: topic}
      - {id: "7.7+7.8", title: "Common Ancestry · Continuing Evolution", skill: "6.E, 3.D", periods: 1, kind: topic}
      # 3 periods, not 2: highest exam weight in the course and the unit
      # practitioners flag as hardest because it requires applying several
      # concepts at once — phylogeny is where that stacking shows up.
      - {id: "7.9", title: "Phylogeny", skill: "2.D", periods: 3, kind: topic}
      - {id: "INV-3", title: "Investigation 3 — Comparing DNA Sequences with BLAST", kind: lab, notes: "Big Idea 1: Evolution. Computer-based, no consumables.", prep: {bench: 1}}
      - {id: "7.10+7.11", title: "Speciation · Variations in Populations", skill: "2.B, 6.C", periods: 1, kind: topic}
      - {id: "7.12", title: "Origins of Life on Earth", skill: "3.B", periods: 1, kind: topic}
      - {id: "7.FLEX", title: "Flex day — catch-up, reteach, or lab overflow", periods: 1, kind: flex}
      - {id: "7.PC", title: "Progress Check 7", periods: 1, kind: assessment}
      - {id: "7.TEST", title: "Unit 7 Assessment", periods: 1, kind: assessment}
    # [PACING] Largest Progress Check in the course (~48 MC in two parts).

  # ---------------------------------------------------------------------------
  - id: unit-8
    phase: spring
    unit: 8
    title: "Ecology"
    weight: [10, 15]
    ced_periods_45: [19, 21]
    entries:
      - {id: "8.1", title: "Responses to the Environment", skill: "3.C", periods: 1, kind: topic}
      # 4 periods, not 3: 8.2 grew in the 2025 CED — carbon, water, nitrogen and
      # phosphorus cycles were all folded in here.
      - {id: "8.2", title: "Energy Flow Through Ecosystems", skill: "6.D", periods: 4, kind: topic, notes: "Biogeochemical cycles were added here in the 2025 CED."}
      - {id: "8.3", title: "Population Ecology", skill: "4.A", periods: 2, kind: topic}
      - {id: "8.4", title: "Effect of Density on Populations", skill: "5.A", periods: 2, kind: topic}
      - {id: "8.5", title: "Community Ecology", skill: "5.B", periods: 3, kind: topic}
      - {id: "8.6", title: "Biodiversity", skill: "6.E", periods: 2, kind: topic}
      - {id: "8.7", title: "Disruptions in Ecosystems", skill: "5.D", periods: 1, kind: topic}
      - {id: "8.FLEX", title: "Flex day — catch-up, reteach, or lab overflow", periods: 1, kind: flex}
      - {id: "8.PC", title: "Progress Check 8", periods: 1, kind: assessment}
      - {id: "8.TEST", title: "Unit 8 Assessment", periods: 1, kind: assessment}

  # ---------------------------------------------------------------------------
  - id: review
    phase: spring
    title: "AP Exam Review"
    entries:
      - {title: "AP review — FRQ practice, reteaching, full-length mocks", periods: fill, kind: review}

  # ---------------------------------------------------------------------------
  - id: post-exam
    phase: post
    title: "After the AP Exam"
    entries:
      - {title: "Post-exam project", periods: fill, kind: review}


# =============================================================================
# INVESTIGATIONS NOT SCHEDULED
# =============================================================================
# The Course Audit requires a minimum of 2 labs per big idea, not all 13, and
# permits substitution. Nine are scheduled above, covering every big idea at or
# above the minimum:
#
#   Big Idea 1 Evolution                 INV-2, INV-3          (2 — minimum met)
#   Big Idea 2 Energetics                INV-4, INV-5, INV-6   (3)
#   Big Idea 3 Information Storage       INV-7, INV-8          (2 — minimum met)
#   Big Idea 4 System Interactions       INV-13                (1)
#
# Big Idea 4 carries one lab rather than two. Deliberate — INV-10 was dropped to
# buy AP review days, and every other spring investigation is load-bearing for
# its own big idea. If you later want a second, INV-11 Transpiration at 2 periods
# in Unit 8 is the cheapest restore.
#
# The five below are not scheduled. Each is a real loss; these were the cheapest
# to cut, not the least valuable. To restore one, paste its line into the right
# unit and rebuild — the build will tell you immediately if it no longer fits,
# and which phase ran out of days.
#
#   - {id: "INV-10", title: "Investigation 10 — Energy Dynamics", kind: lab}
#       Big Idea 4. Unit 8, after topic 8.2. Dropped to free 3 AP review days.
#       The most logistically demanding of the spring set — biomass measurement
#       and organism culture — and it lands in the unit most likely to be rushed.
#   - {id: "INV-11", title: "Investigation 11 — Transpiration", kind: lab, periods: 2}
#       Big Idea 4. Unit 8, topic 8.1. RESTORE THIS ONE to bring Big Idea 4 back
#       to the 2-lab minimum at a cost of only 2 days rather than 3.
#   - {id: "INV-1",  title: "Investigation 1 — Artificial Selection", kind: lab}
#       Big Idea 1. Unit 7, topic 7.3. Needs weeks of plant growth running
