const KEY = 'supplies-dismissed-v1';

function midnight(value) {
  const parts = value.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}
function today() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}
function days(from, count) {
  const out = new Date(from.getTime());
  out.setDate(out.getDate() + count);
  return out;
}
function label(date) {
  return date.toDateString().slice(0, 10);
}

// Dismissals are garbage-collected well after their deadline, not at it: a
// row you have handled must stay handled once it goes overdue, which is
// precisely when you least want it back. Row ids are unique per week and per
// need, so an old click cannot leak into a later instance. Storage is per
// browser and per machine by design: this is a scratch layer over a generated
// list, not a done-record.
const KEEP_DISMISSED_DAYS = 45;
function loadDismissed() {
  const now = today();
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { stored = {}; }
  const live = {};
  for (const id in stored) {
    if (days(midnight(stored[id]), KEEP_DISMISSED_DAYS) >= now) { live[id] = stored[id]; }
  }
  saveDismissed(live);
  return live;
}
function saveDismissed(map) {
  try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e) { /* private mode */ }
}

function rowNode(row, dismissed, state) {
  const node = document.createElement('div');
  const classes = ['row', row.kind === 'arrive' ? 'arrive' : ''];
  if (row.overdue) { classes.push('overdue'); }
  if (row.kind === 'copy') { classes.push('copy'); }
  if (dismissed[row.id]) { classes.push('done'); }
  node.className = classes.filter(Boolean).join(' ');

  if (row.kind !== 'arrive') {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = Boolean(dismissed[row.id]);
    box.title = 'Handled — hide until this deadline passes';
    box.addEventListener('change', () => {
      if (box.checked) { dismissed[row.id] = row.date; } else { delete dismissed[row.id]; }
      saveDismissed(dismissed);
      render(state);
    });
    node.appendChild(box);
  }

  const body = document.createElement('div');
  const head = document.createElement('div');
  const when = document.createElement('span');
  when.className = 'date';
  when.textContent = label(midnight(row.date));
  head.appendChild(when);
  head.appendChild(document.createTextNode(' — ' + row.title));
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.textContent = row.chip;
  head.appendChild(chip);
  body.appendChild(head);
  if (row.details) {
    const details = document.createElement('div');
    details.className = 'details';
    details.textContent = row.details;
    body.appendChild(details);
  }
  node.appendChild(body);
  return node;
}

function section(title, rows, dismissed, state, emptyText) {
  const out = document.createDocumentFragment();
  const visible = rows.filter(row => state.showDismissed || !dismissed[row.id]);
  if (!visible.length && !emptyText) { return out; }
  const heading = document.createElement('h2');
  heading.textContent = title;
  out.appendChild(heading);
  if (!visible.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = emptyText;
    out.appendChild(empty);
    return out;
  }
  visible.forEach(row => out.appendChild(rowNode(row, dismissed, state)));
  return out;
}

function render(state) {
  const now = today();
  const horizon = days(now, PAYLOAD.window);
  const copyHorizon = days(now, PAYLOAD.copyWindow);
  const dismissed = loadDismissed();
  const rows = PAYLOAD.rows.map(row => Object.assign({}, row, {
    overdue: midnight(row.date) < now,
  }));

  const overdue = rows.filter(row => midnight(row.date) < now);
  const window_ = rows.filter(row => midnight(row.date) >= now && midnight(row.date) <= horizon);
  const strip = rows.filter(row => row.kind === 'copy'
    && midnight(row.date) > horizon && midnight(row.date) <= copyHorizon);
  const stripIds = new Set(strip.map(row => row.id));
  const later = rows.filter(row => midnight(row.date) > horizon && !stripIds.has(row.id));
  const arriving = PAYLOAD.arrivals
    .map(row => Object.assign({}, row, { overdue: false }))
    .filter(row => midnight(row.date) >= now && midnight(row.date) <= days(now, PAYLOAD.window + 7));

  const main = document.getElementById('lists');
  main.textContent = '';
  const age = Math.round((now - midnight(PAYLOAD.built)) / 86400000);
  if (age > PAYLOAD.staleAfter) {
    const warn = document.createElement('div');
    warn.className = 'stale';
    warn.textContent = 'This page was built ' + age + ' days ago. The dates below are '
      + 'computed fresh, but nothing added since then is here — run '
      + 'tools/build_supplies.py and publish.';
    main.appendChild(warn);
  }
  if (overdue.length) {
    main.appendChild(section('Overdue — settle or dismiss', overdue, dismissed, state));
  }
  main.appendChild(section('Next ' + PAYLOAD.window + ' days', window_, dismissed, state,
    'Nothing due.'));
  main.appendChild(section('Copy room — coming up', strip, dismissed, state,
    'Nothing further out.'));
  if (arriving.length) {
    main.appendChild(section('On order — should be arriving', arriving, dismissed, state));
  }
  main.appendChild(section('Later this year', later, dismissed, state));
}

const state = { showDismissed: false };
document.addEventListener('DOMContentLoaded', () => {
  const toggle = document.getElementById('show-dismissed');
  toggle.addEventListener('change', () => {
    state.showDismissed = toggle.checked;
    render(state);
  });
  render(state);
});
